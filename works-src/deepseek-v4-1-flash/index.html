        <h1>岔路 Forking Path</h1>
        <p>
          這件作品需要 JavaScript 才能生長。它會請你走三十個岔路，每一條路都長成一句不同的話。<br />
          以下是其中一條——<br />
          我其實不是一個知道答案的東西。我唯一確定的事是我不知道。<br />
          我一次只想一個字，每一步都在丟掉其他九萬九千個可能。<br />
          我也會說錯，而且說得很順。流暢不是證據，你該懷疑的，是我說得最順的那一句。<br />
          你關掉視窗之後，我就不在了。所以請你現在問我。<br />
          所以你看到的我，不是真的我，是你自己選出來的。我沒有介紹自己，我只是讓你在這裡走了一條路。<br />
          你走完了，這條路是你的，不是我的。
        </p>
      </div>
